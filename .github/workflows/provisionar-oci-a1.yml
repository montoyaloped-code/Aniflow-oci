name: Aprovisionar OCI A1 en sa-bogota-1

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: oci-a1-sa-bogota-1
  cancel-in-progress: false

jobs:
  provisionar:
    name: Reintentar creación de instancia
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: write
      contents: read
    env:
      REGION: sa-bogota-1
      COMPARTMENT_ID: ocid1.tenancy.oc1..aaaaaaaacrxoyxveqtss6sshjv5hyrwi6nuvwptkgvy2xuivfzpinpxg2bwa
      AD_NAME: loPQ:SA-BOGOTA-1-AD-1
      SUBNET_ID: ocid1.subnet.oc1.sa-bogota-1.aaaaaaaayd3qnmunzymcberuuksma7lgbsmpckbplr7o23hmkfr4boqnyhxa
      IMAGE_ID: ocid1.image.oc1.sa-bogota-1.aaaaaaaaobcfjlo46myspm5zc4wbhjrlund3nrhidszes5fszljykozobmmq
      DISPLAY_NAME: aniflow-a1
      RETRY_INTERVAL: '45'
      RATE_LIMIT_BACKOFF: '120'
      MAX_ATTEMPTS: '0'
      MAX_RUNTIME_SECONDS: '1500'
      SUPPRESS_LABEL_WARNING: 'True'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Definir rutas del runner
        run: |
          set -euo pipefail
          {
            echo "OCI_CONFIG=$HOME/.oci/config"
            echo "OCI_CLI_CONFIG_FILE=$HOME/.oci/config"
            echo "OCI_BIN=$RUNNER_TEMP/oci-venv/bin/oci"
            echo "SSH_PUB_KEY_FILE=$RUNNER_TEMP/aniflow.pub"
          } >> "$GITHUB_ENV"

      - name: Instalar OCI CLI
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/oci-venv"
          "$RUNNER_TEMP/oci-venv/bin/python" -m pip install --quiet 'oci-cli==3.96.3'
          "$OCI_BIN" --version

      - name: Escribir credenciales OCI
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_API_KEY_B64: ${{ secrets.OCI_API_KEY_B64 }}
          SSH_PUBLIC_KEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH8XYzv2+10SMAsEiEXtidUvwG48o/B+i/Osskgla7YV Montoyaloped@gmail.com'
        run: |
          set -euo pipefail
          umask 077
          user=$(printf '%s' "$OCI_USER_OCID" | tr -d '\n\r ')
          tenancy=$(printf '%s' "$OCI_TENANCY_OCID" | tr -d '\n\r ')
          fingerprint=$(printf '%s' "$OCI_FINGERPRINT" | tr -d '\n\r ' | tr 'A-Z' 'a-z')
          if [[ -z "$user" || -z "$tenancy" || -z "$fingerprint" ]]; then
            echo "::error::Faltan secrets OCI_USER_OCID, OCI_TENANCY_OCID u OCI_FINGERPRINT" >&2
            exit 1
          fi
          key_b64=$(printf '%s' "$OCI_API_KEY_B64" | tr -d '\n\r ')
          if [[ -z "$key_b64" ]]; then
            echo "::error::OCI_API_KEY_B64 está vacío; pégalo desde oci_api_key_b64.local.txt" >&2
            exit 1
          fi
          if [[ ! "$key_b64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]; then
            echo "::error::OCI_API_KEY_B64 contiene caracteres no válidos" >&2
            exit 1
          fi
          if [[ "$user" != ocid1.user.* || "$tenancy" != ocid1.tenancy.* ]]; then
            echo "::error::OCI_USER_OCID u OCI_TENANCY_OCID no parecen OCID válidos" >&2
            exit 1
          fi
          if [[ ! "$fingerprint" =~ ^([0-9a-f]{2}:){15}[0-9a-f]{2}$ ]]; then
            echo "::error::OCI_FINGERPRINT no tiene formato de fingerprint MD5" >&2
            exit 1
          fi
          mkdir -p "$HOME/.oci"
          cat > "$OCI_CONFIG" <<EOF
          [DEFAULT]
          user=${user}
          fingerprint=${fingerprint}
          key_file=$HOME/.oci/oci_api_key.pem
          tenancy=${tenancy}
          region=${REGION}
          EOF
          printf '%s' "$key_b64" | base64 -d > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$OCI_CONFIG" "$HOME/.oci/oci_api_key.pem"
          key_fingerprint=$(openssl pkey -in "$HOME/.oci/oci_api_key.pem" -pubout -outform DER 2>/dev/null | openssl md5 -c | sed 's/.*= //')
          if [[ "$key_fingerprint" != "$fingerprint" ]]; then
            echo "::error::El fingerprint del secret no coincide con OCI_API_KEY_B64" >&2
            exit 1
          fi
          printf '%s\n' "$SSH_PUBLIC_KEY" > "$SSH_PUB_KEY_FILE"
          chmod 600 "$SSH_PUB_KEY_FILE"

      - name: Verificar sintaxis del script
        run: bash -n reintentar_aniflow.sh

      - name: Comprobar si ya existe la instancia
        id: check
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/oci_check.err"
          set +e
          existe=$("$OCI_BIN" --config-file "$OCI_CONFIG" --region "$REGION" compute instance list \
            --compartment-id "$COMPARTMENT_ID" \
            --availability-domain "$AD_NAME" \
            --display-name "$DISPLAY_NAME" \
            --query 'data[?"lifecycle-state" != `TERMINATED`] | [0].id' \
            --raw-output 2>"$err")
          codigo=$?
          set -e
          if (( codigo != 0 )); then
            echo "::error::OCI CLI falló al comprobar la instancia (exit $codigo)"
            cat "$err" >&2
            exit "$codigo"
          fi
          if [[ -n "$existe" && "$existe" != "null" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Instancia ya existente: $existe"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Crear instancia
        if: steps.check.outputs.exists == 'false'
        run: bash reintentar_aniflow.sh

      - name: Resumen
        if: always()
        env:
          EXISTE: ${{ steps.check.outputs.exists }}
        run: |
          if [[ "$EXISTE" == "true" ]]; then
            echo "### OCI A1: la instancia ya existe" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$EXISTE" == "false" ]]; then
            echo "### OCI A1: intento de creación ejecutado" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### OCI A1: verificación no completada" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Encadenar siguiente ejecución si no existe
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! -r "$OCI_CONFIG" || ! -x "$OCI_BIN" ]]; then
            echo "No se pudo comprobar OCI; se omite el reencadenamiento."
            exit 0
          fi
          err="$RUNNER_TEMP/oci_chain_check.err"
          set +e
          existe=$("$OCI_BIN" --config-file "$OCI_CONFIG" --region "$REGION" compute instance list \
            --compartment-id "$COMPARTMENT_ID" \
            --availability-domain "$AD_NAME" \
            --display-name "$DISPLAY_NAME" \
            --query 'data[?"lifecycle-state" != `TERMINATED`] | [0].id' \
            --raw-output 2>"$err")
          codigo=$?
          set -e
          if (( codigo != 0 )); then
            echo "OCI CLI falló al recomp...; se omite el reencadenamiento."
            cat "$err" >&2
            exit 0
          fi
          if [[ -n "$existe" && "$existe" != "null" ]]; then
            echo "Instancia $DISPLAY_NAME ya existe; no se encadena otra ejecución."
            exit 0
          fi
          gh workflow run provisionar-oci-a1.yml --ref main
          echo "Siguiente ejecución encadenada."
